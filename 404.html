<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // When GitHub Pages returns a 404 (e.g., /zh-CN), this script kicks in.
        // It redirects to the root and passes the original path as a query parameter.
        var path = window.location.pathname;
        window.location.replace("/?redirect=" + path);
    </script>
</head>
<body>
    <p>Redirecting to homepage...</p>
</body>
</html>
