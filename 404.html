<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var path = window.location.pathname;
            var lastSegment = path.split('/').pop();
            
            // If the path has no file extension (like /contribution), append .html automatically
            if (lastSegment.indexOf('.') === -1) {
                window.location.replace(path + '.html');
            } else {
                // Fallback for language routing: redirect back to index with the path
                window.location.replace("/?redirect=" + path);
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
