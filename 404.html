        /* Reuse the same CSS variables */
        :root {

            --brand-300: #93c5fd;
            --brand-400: #60a5fa;
            --brand-500: #3b82f6;
            --brand-600: #2563eb;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'Fira Code', monospace;
            --shape-start: #8da4f1;
            --shape-end: #6c7ee5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background-color: var(--bg-base); }
        body {
            font-family: var(--font-sans); background-color: var(--bg-base); color: var(--text-primary);
            line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }

        /* RTL Support */
        html[dir="rtl"] body { direction: rtl; }
        html[dir="rtl"] nav { flex-direction: row-reverse; }
        html[dir="rtl"] .lang-switcher { margin-right: 16px; margin-left: 0; }
        html[dir="rtl"] .dropdown-content { right: auto; left: 0; }
        html[dir="rtl"] .logo { flex-direction: row-reverse; }

        a { color: var(--text-primary); text-decoration: none; transition: color 0.2s ease; }
        a:hover { color: var(--brand-400); }

        /* Header & Navigation */
        header {
            position: sticky; top: 0; z-index: 100;

        nav { display: flex; gap: 24px; align-items: center; font-size: 13.5px; font-weight: 500; color: var(--text-secondary); }
        nav a { color: var(--text-secondary); }
        nav a:hover { color: #fff; }

        /* Language Dropdown */
        .lang-switcher { position: relative; display: inline-block; margin-left: 10px; }
        .lang-btn {
            background-color: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.3);
            color: var(--brand-300); padding: 6px 10px; border-radius: 8px;
            font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer;
            transition: all 0.2s ease; font-size: 13px;
        }
        .lang-btn:hover { background-color: rgba(59,130,246,.2); border-color: var(--brand-400); color: #fff; }
        .dropdown-content {
            display: none; position: absolute; right: 0; top: 100%; margin-top: 8px;
            background-color: var(--bg-surface); border: 1px solid var(--border-color);
            border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); min-width: 140px; z-index: 101;
            max-height: 400px; overflow-y: auto;
        }
        .dropdown-content.show { display: block; }
        .dropdown-content a { display: block; padding: 8px 16px; font-size: 13px; color: var(--text-primary); cursor: pointer;}
        .dropdown-content a:hover { background-color: rgba(255,255,255,0.05); color: var(--brand-400); }
        .machine-ast { font-size: 10px; color: var(--text-muted); margin-left: 2px; vertical-align: super;}

        /* Main Hero Section */
        main {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 40px 24px 80px; position: relative;
        }

        .hero-shape-container {
            position: absolute; top: 10%; left: 50%;
            transform: translateX(-50%);
            width: clamp(200px, 30vw, 300px); height: clamp(200px, 30vw, 300px);
            z-index: -1; opacity: 0.1;
            filter: blur(30px);
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }

        .hero-title {
            font-size: clamp(4rem, 10vw, 8rem); font-weight: 800; color: #fff;
            margin-bottom: 1rem; letter-spacing: -2px; line-height: 1; position: relative; z-index: 1;
            background: linear-gradient(90deg, #fff 0%, var(--brand-500) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero-subtitle { 
            font-size: clamp(1rem, 2vw, 1.25rem); color: var(--text-secondary);

        }
        .hero-subtitle span { color: var(--brand-300); font-weight: 600; }

        .btn {
            padding: 12px 28px; border-radius: 12px; font-weight: 600; font-size: 15px;
            cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(180deg, var(--brand-500) 0%, var(--brand-600) 100%);
            color: #fff; box-shadow: 0 10px 24px -10px rgba(37,99,235,.55);

        .footer-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .footer-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .footer-links { display: flex; gap: 24px; }
        .footer-links a { color: var(--text-muted); font-weight: 500; }
        .footer-links a:hover { color: var(--brand-400); }
        .footer-notice { font-size: 12px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; text-align: left; display: none; }
        .footer-notice .ast { color: var(--brand-400); font-weight: bold;}

        @keyframes float { 
            0% { transform: translate(-50%, 0px) rotate(0deg); } 
            50% { transform: translate(-50%, -20px) rotate(10deg); } 
            100% { transform: translate(-50%, 0px) rotate(0deg); }

        @media (max-width: 768px) {

            nav { flex-wrap: wrap; justify-content: center; gap: 16px; }
            .footer-top { flex-direction: column; text-align: center; }

                machine_trans_notice: "* Некоторые языки предоставлены машинным переводом. Мы приветствуем исправления от сообщества.",

            },
            'de-DE': {

                footer_status: "Status", footer_policy: "Richtlinie", footer_contact: "Kontakt",

                footer_status: "الحالة", footer_policy: "سياسة", footer_contact: "اتصل بنا",
                machine_trans_notice: "* بعض اللغات مترجمة آلياً. نرحب بتصحيحات المجتمع.",
                "404_desc": "الصفحة التي تبحث عنها انجرفت إلى الفراغ.",
                "404_btn": "العودة إلى الصفحة الرئيسية"
            }
        };

        // ==========================================
        // 3. Core Functions (Same routing logic)
        // ==========================================
        
        function updateURL(langCode) {
            const url = new URL(window.location);
            if (langCode === 'en-US') {
                url.searchParams.delete('lang');
            } else {
                url.searchParams.set('lang', langCode);
            }
            window.history.replaceState({ lang: langCode }, '', url);
        }

        document.getElementById('lang-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('lang-menu').classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('lang-menu');
            const btn = document.getElementById('lang-btn');
            if (menu.classList.contains('show') && !btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.remove('show');
            }
        });

        function setLanguage(langCode, updateUrl = true) {
            document.cookie = `linkest_lang=${langCode}; path=/; max-age=31536000`;
            
            const langConfig = languages.find(l => l.code === langCode) || languages[0];
            const dict = Object.assign({}, i18n['en-US'], i18n[langCode] || {});

            document.documentElement.setAttribute('dir', langConfig.rtl ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', langCode);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) el.innerHTML = dict[key];
            });

            const machineNotice = document.getElementById('machine-notice');
            if (langConfig.isMachine) {
                machineNotice.style.display = 'block';
            } else {
                machineNotice.style.display = 'none';
            }

            if (updateUrl) updateURL(langCode);
            renderMenu(langCode);
            document.getElementById('lang-menu').classList.remove('show');
        }

        function renderMenu(currentLang) {
            const menu = document.getElementById('lang-menu');
            menu.innerHTML = '';
            languages.forEach(lang => {
                const a = document.createElement('a');
                a.innerHTML = lang.name + (lang.isMachine ? '<span class="machine-ast">*</span>' : '');
                
                if (lang.code === currentLang) {
                    a.style.color = 'var(--brand-400)';
                    a.style.backgroundColor = 'rgba(59,130,246,.1)';
                }
                
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    setLanguage(lang.code);
                });
                
                menu.appendChild(a);
            });
        }

        function initLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && languages.some(l => l.code === urlLang)) {
                return urlLang;
            }

            const match = document.cookie.match(/(^| )linkest_lang=([^;]+)/);
            if (match) return match[2];
            
            const browserLang = navigator.language || navigator.userLanguage;
            const matchedLang = languages.find(l => browserLang.startsWith(l.code.split('-')[0]));
            return matchedLang ? matchedLang.code : 'en-US';
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            const initialLang = initLanguage();
            setLanguage(initialLang, false); 
        });
    </script>
